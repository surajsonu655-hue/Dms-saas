<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DMS Dashboard</title>
<style>
:root{--bg:#eef5fd;--card:#fff;--ink:#1b2b4a;--mut:#5d6f8f;--line:#dbe6f5;--acc:#2672d6;--acc2:#e6f0fc;--ok:#1a7f56;--warn:#a96a12;--bad:#c0392b;--info:#4b5fd0;--act:#1f78d1;--neu:#66758f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Inter","Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
aside{background:var(--card);border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:0;height:100vh}
.logo{font-weight:700;font-size:17px;padding:4px 10px 16px;color:var(--acc)}
nav button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--mut);padding:9px 12px;border-radius:8px;font:inherit;cursor:pointer;margin-bottom:2px}
nav button.on,nav button:hover{background:var(--acc2);color:var(--acc);font-weight:600}
main{padding:18px 22px;min-width:0}
.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.top h1{font-size:20px;margin:0 auto 0 0}
select,input,button.b{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 10px}
button.b{cursor:pointer}button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--act);outline-offset:1px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}
.kpi:hover,.kpi.on{border-color:var(--acc)}
.kpi small{color:var(--mut);display:block}.kpi b{font-size:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0;box-shadow:0 1px 3px #2672d614;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:14px}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}.row span:first-child{width:110px;color:var(--mut);font-size:12px}
.bar{height:10px;border-radius:5px;background:var(--acc);min-width:2px}
.days{display:flex;align-items:flex-end;gap:8px;height:130px}.days div{flex:1;text-align:center;font-size:11px;color:var(--mut)}.days i{display:block;background:var(--acc);border-radius:4px 4px 0 0;margin-bottom:3px}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mut);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.badge{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor}
.s-delivered{color:var(--ok)}.s-ready,.s-created,.s-assigned,.s-accepted{color:var(--warn)}.s-failed{color:var(--bad)}.s-returned{color:var(--neu)}.s-partial{color:var(--info)}.s-picked,.s-out,.s-arrived{color:var(--act)}
.tl{margin:0;padding:0;list-style:none;max-height:240px;overflow:auto}.tl li{padding:6px 0 6px 12px;border-left:2px solid var(--line);font-size:13px}.tl small{color:var(--mut)}
.mini{font-size:12px;padding:3px 8px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:420px;width:92%}
dialog::backdrop{background:#0008}.f{display:grid;gap:8px}.f label{display:grid;gap:3px;color:var(--mut);font-size:12px}
.sum{background:var(--acc2);border-radius:8px;padding:10px;font-weight:600}.sum div{display:flex;justify-content:space-between}
.err{color:var(--bad);font-weight:600;min-height:18px}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none}#toast.on{opacity:1}
.empty{padding:24px;text-align:center;color:var(--mut)}
@media(max-width:760px){.app{grid-template-columns:1fr}aside{position:static;height:auto;display:flex;overflow-x:auto;padding:8px}.logo{display:none}nav{display:flex}nav button{white-space:nowrap}main{padding:12px}}

.tb{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:16px;box-shadow:0 1px 3px #2672d614;position:sticky;top:6px;z-index:4}
.tb h1{font-size:18px;margin:0 auto 0 0}.demo{background:var(--acc2);color:var(--acc);border-radius:8px;padding:3px 8px;font-size:11px;font-weight:700;display:flex;gap:6px;align-items:center}.demo select{padding:3px 6px;font-size:12px}
.ic{position:relative;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 9px;cursor:pointer}.ic i{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border-radius:99px;font-size:10px;font-style:normal;padding:0 5px}
.pf{position:relative}#av{width:36px;height:36px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-weight:700;cursor:pointer}
#pm{position:absolute;right:0;top:44px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px #1b2b4a22;min-width:210px;padding:6px}#pm[hidden]{display:none}#pm button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:8px 10px;border-radius:6px;cursor:pointer;font:inherit}#pm button:hover{background:var(--acc2)}#pm small{display:block;padding:6px 10px;color:var(--mut)}
th{background:#f5f9ff;position:sticky;top:0}tr:hover td{background:#f9fbff}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line)}.tabs button{border:0;background:none;padding:8px 12px;color:var(--mut);cursor:pointer;font:inherit;border-bottom:2px solid transparent}.tabs button.on{color:var(--acc);border-color:var(--acc);font-weight:600}
#login{position:fixed;inset:0;background:var(--bg);z-index:20;display:grid;place-items:center}#login[hidden]{display:none}#login form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px;width:min(380px,92%);display:grid;gap:10px;box-shadow:0 8px 30px #2672d622}
.pgn{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;color:var(--mut)}.mut{color:var(--mut)}.ib{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.pt aside{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;display:block;z-index:5;border-top:1px solid var(--line);padding:4px}.pt nav{display:flex;justify-content:space-around}.pt .logo{display:none}.pt main{max-width:480px;margin:0 auto;padding-bottom:84px}.pt .app{grid-template-columns:1fr}
.big{font-size:30px;font-weight:700}.dc{border-left:4px solid var(--acc)}a.b{text-decoration:none;display:inline-block}
</style></head><body>
<div class="app"><aside><div class="logo">DMS</div><nav id="nav"></nav></aside>
<main>
<header class="tb"><h1 id="title"></h1><select id="biz" aria-label="Business"></select><select id="range" aria-label="Date range"><option value="0">Today</option><option value="1">Yesterday</option><option value="7" selected>This week</option><option value="30">This month</option><option value="-1">Last month</option></select><button class="b" id="exp">Export orders</button><span class="demo">DEMO MODE <select id="role" aria-label="Demo role"><option value="owner">Owner</option><option value="admin">Business Admin</option><option value="manager">Manager</option><option value="partner">Delivery Partner</option></select></span><button class="ic" id="bell" aria-label="Notifications">🔔<i id="bc"></i></button><div class="pf"><button id="av" aria-label="Profile menu"></button><div id="pm" hidden><small id="un"></small><button data-go="account">Profile</button><button data-go="account">Account settings</button><button data-go="account">Change password</button><button data-lo="1">Logout</button></div></div></header>
<div id="view"></div></main></div>
<div id="login"><form id="lf"><div class="logo" style="padding:0">DMS</div><b>Sign in</b><label class="mut">Email<br><input id="le" type="email" value="" autocomplete="username" style="width:100%"></label><label class="mut">Password<br><input id="lp" type="password" autocomplete="current-password" style="width:100%"></label><div class="err" id="lerr"></div><button class="b p" type="submit">Sign in</button><small class="mut">Demo account: demo@dms.com / Demo@123</small></form></div><dialog id="dlg"></dialog><div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const ST={created:'Created',ready:'Ready',assigned:'Assigned',accepted:'Accepted',picked:'Picked up',out:'Out for delivery',arrived:'Arrived',delivered:'Delivered',partial:'Partial',failed:'Failed',returned:'Returned'};
const NEXT={ready:'assigned',assigned:'accepted',accepted:'picked',picked:'out',out:'arrived'};
const FINAL=['delivered','partial','failed','returned'];
const BIZ=[{id:1,name:'Store 2 Door',type:'Grocery'},{id:2,name:'Apex Pharmacy',type:'Pharmacy'},{id:3,name:'Crumb & Co Bakery',type:'Bakery'}];
const NAMES=['Rahul','Amit','Sana','Vikram','Neha','Arjun','Priya','Kabir','Meera','Ravi','Isha','Dev','Anya','Karan','Zoya'];
const CUST=['A. Sharma','R. Gupta','S. Khan','M. Verma','P. Singh','N. Joshi','K. Mehta','D. Rao','L. Iyer','T. Bose'];
const AREAS=['Sector 14','DLF Phase 2','Sohna Rd','Golf Course Rd','MG Road'];
let seed=7;const rnd=n=>{seed=(seed*9301+49297)%233280;return Math.floor(seed/233280*n)};
const now=Date.now(),D=864e5;
let partners=[],orders=[],returns=[],log=[],oid=1000,rid=1;
BIZ.forEach(b=>{for(let i=0;i<5;i++)partners.push({id:partners.length+1,biz:b.id,name:NAMES[b.id*5-5+i],settled:0})});
const stats=['delivered','delivered','delivered','partial','failed','returned','out','assigned','ready','accepted','picked'];
BIZ.forEach(b=>{const ps=partners.filter(p=>p.biz===b.id);for(let i=0;i<40;i++){
 const st=stats[rnd(stats.length)],amt=300+rnd(2200),pm=['Cash','UPI','Card','Online'][rnd(4)];
 const o={id:++oid,biz:b.id,bill:'B'+(5000+oid),cust:CUST[rnd(10)],phone:'98'+(10000000+rnd(89999999)),area:AREAS[rnd(5)],amt,pm,cod:pm==='Cash',st,pid:st==='ready'?null:ps[rnd(5)].id,t:now-rnd(7)*D-rnd(8)*36e5,ret:0,coll:0,ev:[],att:[]};
 if(st==='delivered'){o.coll=amt}if(st==='partial'){o.ret=Math.round(amt*.2);o.coll=amt-o.ret;returns.push({id:rid++,biz:b.id,oid:o.id,amt:o.ret,reason:'Damaged',st:'Return created',t:o.t})}
 if(st==='returned'){o.ret=amt;returns.push({id:rid++,biz:b.id,oid:o.id,amt,reason:'Customer Rejected',st:'Return received',t:o.t})}
 if(st==='failed')o.att.push('Customer unavailable');
 o.ev.push({a:'Created',u:'Admin',t:o.t});if(o.pid)o.ev.push({a:'Assigned to '+pn(o.pid),u:'Manager',t:o.t+6e5});orders.push(o)}});
function pn(id){return(partners.find(p=>p.id===id)||{}).name}
const $=s=>document.querySelector(s),fmt=n=>'₹'+Math.round(n).toLocaleString('en-IN');
let S={biz:1,role:'admin',view:'dash',filter:null,q:'',range:7};
const NAV0={admin:[['dash','Dashboard'],['orders','Orders'],['partners','Delivery Partners'],['cod','COD'],['returns','Returns'],['audit','Audit Log']],manager:[['dash','Dashboard'],['orders','Order Queue'],['partners','Delivery Partners'],['cod','COD'],['returns','Returns']]};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}
function scoped(){const cut=S.range===0?new Date().setHours(0,0,0,0):S.range===1?new Date().setHours(0,0,0,0)-D:now-S.range*D;
 return orders.filter(o=>o.biz===S.biz&&o.t>=cut&&(S.range!==1||o.t<cut+D))}
function event(o,a){const u=S.role==='admin'?'Admin':'Manager';o.ev.push({a,u,t:Date.now()});log.unshift({biz:o.biz,t:Date.now(),u,a:a+' · Order #'+o.id})}
function setSt(o,s,a){o.st=s;event(o,a||ST[s])}
function badge(s){return `<span class="badge s-${s}">${ST[s]}</span>`}
function count(l,f){return l.filter(f).length}
function render(){
 $('#nav').innerHTML=NAV[S.role].map(([k,n])=>`<button class="${S.view===k?'on':''}" data-v="${k}">${n}</button>`).join('');
 const b=BIZ.find(x=>x.id===S.biz);$('#title').textContent=b.name+' · '+(NAV[S.role].find(n=>n[0]===S.view)||[0,''])[1];
 ({dash,orders:ordersV,partners:partnersV,cod:codV,returns:retV,audit:auditV})[S.view]()}
function dash0(){
 const L=scoped(),K=[['Total',null,L.length],['Assigned','assigned',count(L,o=>['assigned','accepted'].includes(o.st))],['Out for delivery','out',count(L,o=>['picked','out','arrived'].includes(o.st))],['Delivered','delivered',count(L,o=>o.st==='delivered')],['Partial','partial',count(L,o=>o.st==='partial')],['Cancelled','cancelled',count(L,o=>o.st==='cancelled')],['Fully returned','returned',count(L,o=>o.st==='returned')],['Total collection','collected',fmt(L.reduce((a,o)=>a+o.coll,0))]];
 const sc=Object.keys(ST).map(k=>[k,count(L,o=>o.st===k)]),mx=Math.max(1,...sc.map(x=>x[1]));
 const days=[...Array(7)].map((_,i)=>{let d=new Date();d.setHours(0,0,0,0);d=new Date(d-(6-i)*D);return[d.toLocaleDateString('en',{weekday:'short'}),orders.filter(o=>o.biz===S.biz&&o.st==='delivered'&&o.t>=d&&o.t<+d+D).length]});
 const dm=Math.max(1,...days.map(x=>x[1]));
 const ps=partners.filter(p=>p.biz===S.biz).map(p=>{const m=L.filter(o=>o.pid===p.id),done=count(m,o=>FINAL.includes(o.st)),ok=count(m,o=>o.st==='delivered'||o.st==='partial');return{n:p.name,as:m.length,ok,rate:done?Math.round(ok/done*100):0}});
 $('#view').innerHTML=`<div class="kpis">${K.map(k=>`<button class="kpi" data-k="${k[1]||''}"><small>${k[0]}</small><b>${k[2]}</b></button>`).join('')}</div>
 <div class="grid"><div class="card"><h3>Daily deliveries</h3><div class="days">${days.map(d=>`<div><i style="height:${d[1]/dm*100}px"></i>${d[0]}<br>${d[1]}</div>`).join('')}</div></div>
 <div class="card"><h3>Delivery status</h3>${sc.map(([k,n])=>`<div class="row"><span>${ST[k]}</span><div class="bar s-${k}" style="width:${n/mx*60}%;background:currentColor"></div><span style="width:auto">${n}</span></div>`).join('')}</div></div>
 <div class="grid"><div class="card"><h3>Delivery partner performance</h3><div class="wrap"><table><tr><th>Partner</th><th>Assigned</th><th>Completed</th><th>Success</th></tr>${ps.map(p=>`<tr><td>${p.n}</td><td>${p.as}</td><td>${p.ok}</td><td>${p.rate}%</td></tr>`).join('')}</table></div></div>
 <div class="card"><h3>Recent activity</h3><ul class="tl">${(log.filter(l=>l.biz===S.biz).concat(orders.filter(o=>o.biz===S.biz).flatMap(o=>o.ev.slice(-1).map(e=>({t:e.t,u:e.u,a:e.a+' · Order #'+o.id})))).sort((a,b)=>b.t-a.t).slice(0,8)).map(l=>`<li>${l.a}<br><small>${l.u} · ${new Date(l.t).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</small></li>`).join('')}</ul></div></div>`}
function ordersV(){
 let L=scoped();const f=S.filter;
 if(f==='cod')L=L.filter(o=>o.pm==='Cash');else if(f==='assigned')L=L.filter(o=>['assigned','accepted'].includes(o.st));else if(f==='out')L=L.filter(o=>['picked','out','arrived'].includes(o.st));else if(f==='collected')L=L.filter(o=>o.coll>0);else if(f)L=L.filter(o=>o.st===f);
 const q=S.q.toLowerCase();if(q)L=L.filter(o=>[o.id,o.bill,o.cust,o.phone,pn(o.pid)].join(' ').toLowerCase().includes(q));
 if(S.pf)L=L.filter(o=>o.pid==S.pf);L=L.sort((a,b)=>b.t-a.t).slice(0,60);
 $('#view').innerHTML=`<div class="top"><input id="q" placeholder="Search order, bill, customer, phone, partner" value="${S.q}" style="flex:1;min-width:200px"><select id="pf"><option value="">All partners</option>${partners.filter(p=>p.biz===S.biz).map(p=>`<option value="${p.id}" ${S.pf==p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><select id="st"><option value="">All statuses</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${f===k?'selected':''}>${v}</option>`).join('')}</select><button class="b" data-oex="1">Excel</button><button class="b p" id="new">+ New order</button></div>
 <div class="card wrap">${L.length?`<table><tr><th>Order</th><th>Customer</th><th>Area</th><th>Bill</th><th>Receivable</th><th>Payment</th><th>Partner</th><th>Status</th><th>Action</th></tr>${L.map(o=>`<tr><td>#${o.id}<br><small>${o.bill}</small></td><td>${o.cust}<br><small>${o.phone}</small></td><td>${o.area}</td><td>${fmt(o.amt)}</td><td>${fmt(o.recv)}</td><td>${o.pm}</td><td>${pn(o.pid)||'—'}</td><td>${badge(o.st)}${o.coll&&o.coll!==o.recv-o.ret?' ⚠ Mismatch':''}</td><td>${actions(o)}</td></tr>`).join('')}</table>`:'<div class="empty">No orders match these filters. Clear the search or change the date range.</div>'}</div>`}
function actions0(o){if(FINAL.includes(o.st)&&!o.verified)return `<button class="b mini p" data-vf="${o.id}">Verify</button>`;
 if(o.st==='created')return `<button class="b mini" data-a="ready" data-id="${o.id}">Mark ready</button>`;
 if(o.st==='ready')return `<select class="mini" data-as="${o.id}"><option value="">Assign…</option>${partners.filter(p=>p.biz===S.biz&&p.duty!==false&&!unres(p.id)).map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select>`;
 if(o.st==='arrived'||o.st==='out')return ['Deliver:delivered','Partial:partial','Full return:returned','Cancel:cancelled'].map(x=>{const[a,b]=x.split(':');return `<button class="b mini" data-o="${b}" data-id="${o.id}">${a}</button>`}).join(' ');
 if(NEXT[o.st])return `<button class="b mini" data-a="next" data-id="${o.id}">→ ${ST[NEXT[o.st]]}</button>`;
 if(o.st==='failed')return `<button class="b mini" data-a="retry" data-id="${o.id}">Retry</button>`;return '—'}
function partnersV(){const L=scoped();
 $('#view').innerHTML=`<div class="card wrap"><table><tr><th>Partner</th><th>Active</th><th>Delivered</th><th>Partial</th><th>Failed</th><th>Returned</th><th>Cash collected</th><th>Pending settlement</th></tr>${partners.filter(p=>p.biz===S.biz).map(p=>{const m=L.filter(o=>o.pid===p.id),c=m.filter(o=>o.pm==='Cash').reduce((a,o)=>a+o.coll,0);return `<tr><td>${p.name}</td><td>${count(m,o=>!FINAL.includes(o.st))}</td><td>${count(m,o=>o.st==='delivered')}</td><td>${count(m,o=>o.st==='partial')}</td><td>${count(m,o=>o.st==='failed')}</td><td>${count(m,o=>o.st==='returned')}</td><td>${fmt(c)}</td><td>${fmt(Math.max(0,c-p.settled))}</td></tr>`}).join('')}</table></div>`}
function codV(){const L=scoped(),ms=['Cash','UPI','Card','Online'],tot=m=>L.filter(o=>o.pm===m).reduce((a,o)=>a+o.coll,0);
 $('#view').innerHTML=`<div class="kpis">${ms.map(m=>`<div class="kpi"><small>${m} collected</small><b>${fmt(tot(m))}</b></div>`).join('')}</div>
 <div class="card wrap"><h3>COD settlement by partner</h3><table><tr><th>Partner</th><th>Collected</th><th>Returns adjustment</th><th>Settled</th><th>Pending</th><th></th></tr>${partners.filter(p=>p.biz===S.biz).map(p=>{const m=L.filter(o=>o.pid===p.id&&o.pm==='Cash'),c=m.reduce((a,o)=>a+o.coll,0),r=m.reduce((a,o)=>a+o.ret,0),pend=Math.max(0,c-p.settled);return `<tr><td>${p.name}</td><td>${fmt(c)}</td><td>−${fmt(r)}</td><td>${fmt(p.settled)}</td><td>${fmt(pend)}</td><td><button class="b mini" data-settle="${p.id}" ${pend?'':'disabled'}>Settle</button></td></tr>`}).join('')}</table></div>`}

/* ===== v4: roles, scope, rights catalog, user assignment ===== */
const MODS=[['business','Business management'],['users','Users / staff'],['orders','Orders'],['deliveries','Deliveries & returns'],['finance','Finance / payments'],['reports','Reports'],['customers','Customers'],['settings','Settings / integrations'],['data','Data']],ACTS=['v','c','e','d','x','m'],ACTL={v:'View',c:'Create',e:'Edit',d:'Delete',x:'Export',m:'Manage'};
const MAPA={business:['dashboard','notifications'],users:['staff','managers','designations'],orders:['orders'],deliveries:['deliveries','partners','tracking','returns'],finance:['cod'],reports:['reports'],customers:['customers'],settings:['settings','integrations','apikeys','webhooks','sheets'],data:['export']},MAPM={business:['dashboard'],orders:['orders','createorders'],deliveries:['assign','reassign','failed','partial','partners','tracking','returns'],finance:['cod'],reports:['reports'],data:['export'],settings:['sheets']};
const cp=o=>JSON.parse(JSON.stringify(o)),mk=o=>{const r={};MODS.forEach(m=>{r[m[0]]={};ACTS.forEach(a=>r[m[0]][a]=(o[m[0]]||'').includes(a)?1:0)});return r};
const ROLES=[{id:1,name:'System Owner',type:'system',base:'Owner',desc:'Full unrestricted access',status:'Active',scope:'all',biz:[],perms:mk(Object.fromEntries(MODS.map(m=>[m[0],'vcedxm'])))},
{id:2,name:'Business Admin',type:'system',base:'Business Admin',desc:'Runs one business',status:'Active',scope:'own',biz:[],perms:mk({business:'vex',users:'vcex',orders:'vcex',deliveries:'vcex',finance:'vx',reports:'vx',customers:'vcex',settings:'vcex',data:'vx'})},
{id:3,name:'Manager',type:'system',base:'Manager',desc:'Day-to-day delivery operations',status:'Active',scope:'own',biz:[],perms:mk({business:'v',orders:'vce',deliveries:'vce',finance:'v',reports:'vx',customers:'v',settings:'vc',data:'vx'})},
{id:4,name:'Delivery Partner',type:'system',base:'Delivery Partner',desc:'Assigned deliveries only',status:'Active',scope:'assigned',biz:[],perms:mk({deliveries:'vce',orders:'v',finance:'v'})}];
ROLES.forEach(r=>r.def=cp(r.perms));const CAT=[];let RID=10;S.rt='roles';
STAFF.forEach(s=>{s.rname=s.role;s.scope=s.role==='Delivery Partner'?'assigned':'own'});
const parentPerms=r=>r.base==='Owner'||r.base==='Business Admin'?null:ROLES.find(x=>x.type==='system'&&x.base===(r.base==='Manager'?'Business Admin':'Manager')).perms;
function sync(r){if(r.type!=='system'||!['Business Admin','Manager'].includes(r.base))return;const A=r.base==='Business Admin',M=A?MAPA:MAPM,T=A?AP:MP;
 BIZ.forEach(b=>{const inS=r.scope!=='selected'||r.biz.includes(b.id);Object.keys(r.perms).forEach(m=>{(M[m]||[]).forEach(k=>{const t=T[b.id][k];if(t)['v','c','e','d','x'].forEach(a=>t[a]=inS?r.perms[m][a]:0)})})});
 CAT.filter(c=>c.status==='Active'&&c.avail.includes(r.base)).forEach(c=>BIZ.forEach(b=>{const t=T[b.id][c.k];if(t)['v','c','e','d','x'].forEach(a=>t[a]=r.perms[c.k]&&r.scope!=='selected'||(r.biz.includes(b.id)&&r.perms[c.k])?r.perms[c.k][a]:0)}))}
function cascade(){for(let i=0;i<3;i++)ROLES.forEach(c=>{const pp=parentPerms(c);if(!pp)return;Object.keys(c.perms).forEach(m=>ACTS.forEach(a=>{if(c.perms[m][a]&&!(pp[m]&&pp[m][a]))c.perms[m][a]=0}))});ROLES.forEach(sync)}
cascade();
function refBiz(){$('#biz').innerHTML=BIZ.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('');$('#biz').value=S.biz}
function confirmD(msg,fn,lbl='Delete'){dlg(`<form method="dialog" class="f"><h3>Please confirm</h3><p>${msg}</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="b" value="x">Cancel</button><button class="b" style="background:var(--bad);color:#fff;border-color:var(--bad)" id="cy" value="y">${lbl}</button></div></form>`);$('#cy').onclick=()=>fn()}
function roleEd(){const r=S.dr,pp=parentPerms(r),lock=r.base==='Owner',sys=r.type==='system',rows=MODS.concat(CAT.filter(c=>c.status==='Active'&&(c.avail.includes(r.base)||(!sys&&c.avail.includes('Custom Role')))).map(c=>[c.k,c.name+' · '+c.cat+' ('+c.type+')']));
 return `<div class="card"><h3>${S.dnew?'Create custom role':'Role · '+esc(r.name)}</h3>${sys?'':`<div class="f"><label>Role name<input id="rln" value="${esc(r.name)}"></label><label>Description<input id="rld" value="${esc(r.desc)}"></label><label>Hierarchy level<select id="rlb" ${S.dnew?'':'disabled'}>${['Business Admin','Manager','Delivery Partner'].map(x=>`<option ${r.base===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Status<select id="rls"><option ${r.status==='Active'?'selected':''}>Active</option><option ${r.status!=='Active'?'selected':''}>Inactive</option></select></label></div>`}
 <p><label class="mut">Business scope <select id="rsc" ${lock?'disabled':''}>${[['all','All businesses'],['selected','Selected businesses'],['own','Own business only'],['assigned','Assigned orders only']].map(x=>`<option value="${x[0]}" ${r.scope===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></label></p>${r.scope==='selected'?`<div class="row" style="flex-wrap:wrap">${BIZ.map(b=>`<label><input type="checkbox" data-rb="${b.id}" ${r.biz.includes(b.id)?'checked':''}> ${esc(b.name)}</label>`).join(' ')}</div>`:''}
 <p class="mut">${lock?'The owner cannot be restricted.':'Greyed boxes are not held by the parent role and cannot be granted.'}</p><div class="wrap"><table><tr><th>Module</th>${ACTS.map(a=>`<th>${ACTL[a]}</th>`).join('')}</tr>${rows.map(m=>`<tr><td>${m[1]}</td>${ACTS.map(a=>`<td><input type="checkbox" data-rp="${m[0]}|${a}" ${r.perms[m[0]]&&r.perms[m[0]][a]?'checked':''} ${lock||(pp&&!(pp[m[0]]&&pp[m[0]][a]))?'disabled':''} aria-label="${m[1]} ${ACTL[a]}"></td>`).join('')}</tr>`).join('')}</table></div><div class="err" id="re"></div><button class="b p" id="rsv">Save</button> <button class="b" id="rcx">Cancel</button></div>`}
function rightsV(){const t=S.rt,tabs=`<div class="tabs">${[['roles','Roles'],['users','User assignment'],['cat','Rights catalog']].map(x=>`<button data-rt="${x[0]}" class="${t===x[0]&&!S.dr?'on':''}">${x[1]}</button>`).join('')}</div>`;let h='';
 if(S.dr)h=roleEd();
 else if(t==='roles'){const q=(S.rq||'').toLowerCase(),L=ROLES.filter(r=>r.name.toLowerCase().includes(q)&&(!S.rty||r.type===S.rty)&&(!S.rsa||r.status===S.rsa)&&(!S.rbf||r.scope!=='selected'||r.biz.includes(+S.rbf))),sel=(id,v,o)=>`<select id="${id}">${o.map(x=>`<option value="${x[0]}" ${String(v||'')===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select>`;
  h=`<div class="top"><input id="rq" placeholder="Search role" value="${esc(S.rq||'')}" style="flex:1;min-width:140px">${sel('rbf',S.rbf,[['','All businesses'],...BIZ.map(b=>[String(b.id),b.name])])}${sel('rty',S.rty,[['','All types'],['system','System'],['custom','Custom']])}${sel('rsa',S.rsa,[['','Any status'],['Active','Active'],['Inactive','Inactive']])}<button class="b" id="nr">+ Add new right</button><button class="b p" id="ncr">+ Create custom role</button></div><div class="card wrap">${L.length?`<table><tr><th>Role</th><th>Type</th><th>Scope</th><th>Users</th><th>Status</th><th>Actions</th></tr>${L.map(r=>`<tr><td><b>${esc(r.name)}</b><br><small class="mut">${esc(r.desc)}</small></td><td>${r.type}</td><td>${{all:'All businesses',selected:'Selected: '+r.biz.map(i=>(BIZ.find(b=>b.id===i)||{name:'?'}).name).join(', '),own:'Own business only',assigned:'Assigned orders only'}[r.scope]}</td><td>${STAFF.filter(s=>s.rname===r.name).length}</td><td><button class="b mini" data-rst="${r.id}" ${r.base==='Owner'?'disabled':''}>${r.status}</button></td><td><button class="b mini" data-re="${r.id}">Edit matrix</button> ${r.base==='Owner'?'':`<button class="b mini" data-rr="${r.id}">Reset</button>`} ${r.type==='custom'?`<button class="b mini" data-rd="${r.id}">Delete</button>`:''}</td></tr>`).join('')}</table>`:'<div class="empty">No roles match these filters.</div>'}</div>`}
 else if(t==='users'){const q=(S.uq||'').toLowerCase(),L=STAFF.filter(s=>(s.name+s.login).toLowerCase().includes(q)&&(!S.ub||s.biz==S.ub)&&(!S.ur||s.rname===S.ur)&&(!S.us||s.st===S.us)),o=(l,v)=>l.map(x=>`<option value="${x[0]}" ${String(x[0])===String(v)?'selected':''}>${esc(x[1])}</option>`).join(''),RL=ROLES.filter(r=>r.base!=='Owner'&&r.status==='Active').map(r=>[r.name,r.name]),SC=[['own','Own business only'],['selected','Selected businesses'],['assigned','Assigned orders only'],['all','All businesses']];
  h=`<div class="top"><input id="uq" placeholder="Search user" value="${esc(S.uq||'')}" style="flex:1;min-width:140px"><select id="ub"><option value="">All businesses</option>${o(BIZ.map(b=>[b.id,b.name]),S.ub)}</select><select id="ur"><option value="">All roles</option>${o(RL,S.ur)}</select><select id="us"><option value="">Any status</option>${o([['Active','Active'],['Inactive','Inactive']],S.us)}</select></div><div class="card wrap">${L.length?`<table><tr><th>User</th><th>Business</th><th>Role</th><th>Scope</th><th>Status</th><th></th></tr>${L.map(s=>`<tr><td>${esc(s.name)}<br><small class="mut">${esc(s.login)}</small></td><td><select data-ub="${s.id}">${o(BIZ.map(b=>[b.id,b.name]),s.biz)}</select></td><td><select data-ur="${s.id}">${o(RL,s.rname)}</select></td><td><select data-uc="${s.id}">${o(SC,s.scope)}</select></td><td><select data-us="${s.id}">${o([['Active','Active'],['Inactive','Inactive']],s.st)}</select></td><td><button class="b mini" data-ud="${s.id}">Delete</button></td></tr>`).join('')}</table>`:'<div class="empty">No users match.</div>'}</div>`}
 else h=`<div class="card wrap"><div class="top"><h3 style="margin:0 auto 0 0">Custom rights</h3><button class="b p" id="nr">+ Add new right</button></div>${CAT.length?`<table><tr><th>Right</th><th>Category</th><th>Available for</th><th>Type</th><th>Status</th></tr>${CAT.map((c,i)=>`<tr><td>${esc(c.name)}<br><small class="mut">${esc(c.desc)}</small></td><td>${esc(c.cat)}</td><td>${c.avail.join(', ')}</td><td>${c.type}</td><td><button class="b mini" data-ct="${i}">${c.status}</button></td></tr>`).join('')}</table>`:'<div class="empty">No custom rights yet. Built-in rights are the nine modules in the role matrix.</div>'}</div>`;
 $('#view').innerHTML=tabs+h}
function newBiz(){dlgForm('New business','<label>Business name<input id="bn"></label><label>Business type<input id="bt" placeholder="e.g. Pharmacy"></label><label>Admin name<input id="ba"></label>',()=>{const n=$('#bn').value.trim(),t=$('#bt').value.trim(),a=$('#ba').value.trim();if(!n||!t||!a)return 'Business name, type and admin name are required.';if(BIZ.some(b=>b.name.toLowerCase()===n.toLowerCase()))return 'A business with this name exists.';
  const id=Math.max(...BIZ.map(b=>b.id))+1;BIZ.push({id,name:esc(n),type:esc(t),status:'Active',plan:'Free',sub:'Trial',created:new Date().toISOString().slice(0,10)});AP[id]={};AM.forEach(([k])=>AP[id][k]={v:0,c:0,e:0,d:0,x:0});MP[id]={};MM.forEach(([k])=>MP[id][k]={v:0,c:0,e:0,d:0,x:0});DESIG[id]=cp(DESIG[1]);

document.addEventListener('click',e=>{const t=e.target,d=t.dataset;if(!(t.id||Object.keys(d).length))return;const own=()=>S.role==='owner'||(toast('Only the platform owner can do this.'),false);
 if(d.rt){S.rt=d.rt;S.dr=null;render()}
 else if(d.re&&own()){S.dr=cp(ROLES.find(r=>r.id==d.re));S.dnew=0;render()}
 else if(t.id==='ncr'&&own()){S.dr={id:null,name:'',desc:'',type:'custom',base:'Manager',status:'Active',scope:'own',biz:[],perms:{}};MODS.forEach(m=>{S.dr.perms[m[0]]={v:0,c:0,e:0,d:0,x:0,m:0}});S.dnew=1;render()}
 else if(t.id==='rcx'){S.dr=null;render()}
 else if(t.id==='rsv'&&own()){const r=S.dr;if(r.type==='custom'){const n=$('#rln').value.trim();if(!n){$('#re').textContent='Role name is required.';return}if(ROLES.some(x=>x.name.toLowerCase()===n.toLowerCase()&&x.id!==r.id)){$('#re').textContent='A role with this name exists.';return}r.name=n;r.desc=$('#rld').value;r.status=$('#rls').value;r.base=$('#rlb').value}

  cascade();BIZ.forEach(b=>note(b.id,'Permission change: role “'+r.name+'” updated'));log.unshift({biz:S.biz,t:Date.now(),u:ROLE[S.role],a:'Role saved: '+r.name});S.dr=null;toast('Role saved; access updated immediately');render()}

 <div class="kpis">${[['Total businesses',BIZ.length,'biz'],['Active',n('Active'),'biz'],['Inactive',n('Inactive'),'biz'],['Suspended',n('Suspended'),'biz'],['Business revenue',fmt(F.reduce((a,x)=>a+x.f.rev,0)),'reports'],['Subscription MRR',fmt(mrr),'revenue'],['Total staff',STAFF.length,'users'],['Managers',cnt('Manager'),'users'],['Delivery partners',cnt('Delivery Partner'),'users']].map(k=>`<button class="kpi" data-go="${k[2]}"><small>${k[0]}</small><b>${k[1]}</b></button>`).join('')}</div>
 <div class="grid"><div class="card"><h3>Revenue overview</h3>${F.map(x=>`<div class="row"><span style="width:130px">${esc(x.b.name)}</span><div class="bar" style="width:${x.f.rev/mx*55}%"></div><b style="width:auto">${fmt(x.f.rev)}</b></div>`).join('')}</div>
 <div class="card"><h3>Business distribution</h3>${Object.entries(types).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><div class="bar" style="width:${v/BIZ.length*60}%;background:var(--act)"></div><b style="width:auto">${v}</b></div>`).join('')}<div class="mut" style="margin-top:8px">Active ${n('Active')} · Inactive ${n('Inactive')} · Suspended ${n('Suspended')}</div></div>
 <div class="card"><h3>Quick actions</h3><div class="qa"><button class="b p" data-go="onboard">+ Onboard business</button><button class="b" data-go="plans">Manage plans</button><button class="b" data-go="reports">Reports</button><button class="b" data-go="support">Support</button><button class="b" data-go="rights">Rights</button></div></div></div>
 <h3>Business overview</h3>${bizTable()}<div class="card"><h3>Recent activity</h3><ul class="tl">${rec.map(r=>`<li>${esc(r.m)} · <b>${esc(bn(r.biz))}</b><br><small>${new Date(r.t).toLocaleString('en-IN')}</small></li>`).join('')||'<li>No activity yet.</li>'}</ul></div>`}
/* onboarding */
function createBiz(n,t,a,em,plan){if(!n||!t||!a)return 'Business name, type and admin name are required.';if(!/^\S+@\S+\.\S+$/.test(em))return 'Enter a valid admin email.';if(BIZ.some(b=>b.name.toLowerCase()===n.toLowerCase()))return 'A business with this name already exists.';if(STAFF.some(s=>s.login===em))return 'This login email is already in use.';
 const id=Math.max(...BIZ.map(b=>b.id))+1;BIZ.push({id,name:esc(n),type:esc(t),status:'Active',plan,sub:'Trial',created:today()});AP[id]={};AM.forEach(([k])=>AP[id][k]={v:0,c:0,e:0,d:0,x:0});MP[id]={};MM.forEach(([k])=>MP[id][k]={v:0,c:0,e:0,d:0,x:0});DESIG[id]=cp(DESIG[1]);RS[id]='complete';
 STAFF.push({id:Math.max(...STAFF.map(x=>x.id))+1,biz:id,role:'Business Admin',rname:'Business Admin',scope:'own',name:esc(a),des:'Administrator',email:esc(em),login:esc(em),mob:'—',st:'Active',join:today()});cascade();refBiz();note(id,'Business onboarded');log.unshift({biz:id,t:Date.now(),u:ROLE[S.role],a:'Business onboarded: '+n});return null}
function onboardV(){const rec=BIZ.slice().sort((a,b)=>b.created.localeCompare(a.created)).slice(0,5);
 $('#view').innerHTML=`<div class="grid"><div class="card"><h3>Onboard a new business</h3><div class="f"><label>Business name<input id="ob1"></label><label>Business type<input id="ob2" placeholder="e.g. Pharmacy, Bakery, Courier"></label><label>Business admin name<input id="ob3"></label><label>Admin login email<input id="ob4" type="email"></label><label>Plan<select id="ob5">${PLANS.map(p=>`<option>${p.n}</option>`).join('')}</select></label><div class="err" id="obe"></div><button class="b p" id="obs">Create business & admin</button></div><p class="mut">The business starts on a trial. The admin receives only the rights you grant under Rights & Permissions, limited to this business.</p></div><div class="card"><h3>Recently onboarded</h3>${rec.map(b=>`<div class="row"><span style="width:auto">${logo(b)}</span><div><b>${esc(b.name)}</b><br><small class="mut">${esc(b.type)} · ${b.plan} · ${b.created}</small></div></div>`).join('')}</div></div>`}
/* billing */
function subsV(){const c=s=>BIZ.filter(b=>b.sub===s).length;
 $('#view').innerHTML=kp(SUBST.map(s=>[s,c(s)]))+`<div class="card wrap"><table><tr><th>Business</th><th>Plan</th><th>Subscription status</th><th>Business status</th><th>Renewal</th><th>Price</th></tr>${BIZ.map(b=>`<tr><td>${esc(b.name)}</td><td>${sel2(PLANS.map(p=>p.n),b.plan,`data-sp="${b.id}"`)}</td><td>${sel2(SUBST,b.sub,`data-ss="${b.id}"`)}</td><td>${b.status}</td><td>${(+b.created.slice(0,4)+1)+b.created.slice(4)}</td><td>${fmt(planPrice(b.plan))}</td></tr>`).join('')}</table></div>`}
function plansV(){$('#view').innerHTML=`<div class="card wrap"><div class="top"><h3 style="margin:0 auto 0 0">SaaS plans</h3><button class="b p" id="np">+ New plan</button></div><table><tr><th>Plan</th><th>Price</th><th>Cycle</th><th>Businesses</th><th>Users</th><th>Orders / mo</th><th>Features</th><th>Businesses on plan</th><th></th></tr>${PLANS.map((p,i)=>`<tr><td><b>${esc(p.n)}</b></td><td>${fmt(p.p)}</td><td>${p.c}</td><td>${lim(p.b)}</td><td>${lim(p.u)}</td><td>${lim(p.o)}</td><td>${esc(p.f)}</td><td>${BIZ.filter(b=>b.plan===p.n).length}</td><td><button class="b mini" data-pe="${i}">Edit</button> <button class="b mini" data-pdx="${i}">Delete</button></td></tr>`).join('')}</table></div>`}
function planForm(i){const p=i==null?{n:'',p:0,c:'Monthly',b:1,u:5,o:100,f:''}:PLANS[i];dlgForm(i==null?'New plan':'Edit plan',`<label>Plan name<input id="pn2" value="${esc(p.n)}"></label><label>Price (₹)<input id="pp" type="number" min="0" value="${p.p}"></label><label>Billing cycle<select id="pc">${['Monthly','Quarterly','Yearly'].map(x=>`<option ${p.c===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Business limit (0 = unlimited)<input id="pb" type="number" min="0" value="${p.b}"></label><label>User limit (0 = unlimited)<input id="pu" type="number" min="0" value="${p.u}"></label><label>Orders / month (0 = unlimited)<input id="po" type="number" min="0" value="${p.o}"></label><label>Features<input id="pf2" value="${esc(p.f)}"></label>`,()=>{
 const n=$('#pn2').value.trim(),v=id=>+$('#'+id).value;if(!n)return 'Plan name is required.';if([v('pp'),v('pb'),v('pu'),v('po')].some(x=>!(x>=0)))return 'Values cannot be negative.';if(PLANS.some((x,j)=>x.n.toLowerCase()===n.toLowerCase()&&j!==i))return 'A plan with this name exists.';
 const o={n:esc(n),p:v('pp'),c:$('#pc').value,b:v('pb'),u:v('pu'),o:v('po'),f:$('#pf2').value.trim()};if(i==null)PLANS.push(o);else{BIZ.forEach(b=>{if(b.plan===PLANS[i].n)b.plan=o.n});PLANS[i]=o}setTimeout(render,50)},'Save plan')}
function revV(){const f=S.pyf||'',L=PAYS.filter(p=>!f||p.st===f),paid=PAYS.filter(p=>p.st==='Paid').reduce((a,p)=>a+p.amt,0),mrr=BIZ.filter(b=>b.sub==='Active').reduce((a,b)=>a+planPrice(b.plan),0);
 const C=['Transaction','Business','Date','Amount','Mode','Status'],rows=L.map(p=>[p.id,bn(p.biz),p.date,p.amt,p.mode,p.st]);window._rep=[C,rows];
 $('#view').innerHTML=kp([['Subscription MRR',fmt(mrr)],['Collected (all time)',fmt(paid)],['Failed payments',PAYS.filter(p=>p.st==='Failed').length],['Businesses on trial',BIZ.filter(b=>b.sub==='Trial').length]])+`<div class="top"><select id="pyf"><option value="">All payments</option>${['Paid','Failed'].map(x=>`<option ${f===x?'selected':''}>${x}</option>`).join('')}</select><button class="b" data-rx="csv">CSV</button><button class="b" data-rx="xlsx">Excel</button></div><div class="card">${table(C,rows.map(r=>[r[0],r[1],r[2],fmt(r[3]),r[4],r[5]]),0)}<p class="mut">Subscription payments from businesses to the platform. Payment gateway is not connected; these records are demo data.</p></div>`}
function supV(){const f=S.tkf||'',L=TICKETS.filter(t=>!f||t.st===f);
 $('#view').innerHTML=kp(['Open','In progress','Resolved'].map(s=>[s,TICKETS.filter(t=>t.st===s).length]))+`<div class="top"><select id="tkf"><option value="">All tickets</option>${['Open','In progress','Resolved'].map(x=>`<option ${f===x?'selected':''}>${x}</option>`).join('')}</select><button class="b p" id="nt">+ New ticket</button></div><div class="card wrap">${L.length?`<table><tr><th>Ticket</th><th>Business</th><th>Subject</th><th>Priority</th><th>Status</th></tr>${L.map(t=>`<tr><td>${t.id}</td><td>${esc(bn(t.biz))}</td><td>${esc(t.subj)}</td><td>${t.prio}</td><td>${sel2(['Open','In progress','Resolved'],t.st,`data-tk="${t.id}"`)}</td></tr>`).join('')}</table>`:'<div class="empty">No tickets in this state.</div>'}</div>`}
function sysV(){$('#view').innerHTML=`<div class="card"><h3>Platform settings</h3><div class="f"><label>Platform name<input value="DMS" disabled></label><label>Default timezone<select id="sz">${['Asia/Kolkata','UTC','Asia/Dubai','Europe/London'].map(x=>`<option ${SYS.tz===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Currency<select id="sc2">${['INR','USD','AED','GBP'].map(x=>`<option ${SYS.cur===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Session timeout (minutes, 5–240)<input id="st2" type="number" value="${SYS.timeout}"></label><label>Minimum password length (6–32)<input id="sw" type="number" value="${SYS.pw}"></label><label><input type="checkbox" id="sm2" ${SYS.maint?'checked':''}> Maintenance mode (banner only in this demo)</label><div class="err" id="sye"></div><button class="b p" id="syssv">Save settings</button></div></div>`}
/* wiring */
Object.assign(V,{odash,onboard:onboardV,users:()=>rtab('users'),subs:subsV,plans:plansV,revenue:revV,support:supV,integ:()=>subView('integ'),apikeys:()=>subView('keys'),hooks:()=>subView('hooks'),sys:sysV,rights:()=>rtab('roles'),notif:notV,biz:bizV});
document.addEventListener('click',e=>{const t=e.target,d=t.dataset;if(S.role!=='owner')return;
 if(t.id==='obs'){const r=createBiz($('#ob1').value.trim(),$('#ob2').value.trim(),$('#ob3').value.trim(),$('#ob4').value.trim().toLowerCase(),$('#ob5').value);if(r)$('#obe').textContent=r;else{toast('Business created');S.view='biz';render()}}
 else if(t.id==='np')planForm();else if(d.pe)planForm(+d.pe);
 else if(d.pdx!==undefined){const p=PLANS[d.pdx],u=BIZ.filter(b=>b.plan===p.n).length;if(u)return toast(u+' business(es) are on this plan. Move them first.');confirmD('Delete the plan “'+esc(p.n)+'”?',()=>{PLANS.splice(+d.pdx,1);setTimeout(render,50)})}
 else if(t.id==='nt')dlgForm('New support ticket',`<label>Business<select id="tb">${BIZ.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></label><label>Subject<input id="ts"></label><label>Priority<select id="tp">${['Low','Medium','High'].map(x=>`<option>${x}</option>`).join('')}</select></label>`,()=>{const s=$('#ts').value.trim();if(!s)return 'Enter a subject.';TICKETS.unshift({id:'T-'+(105+TICKETS.length),biz:+$('#tb').value,subj:esc(s),prio:$('#tp').value,st:'Open'});setTimeout(render,50)},'Create ticket')
 else if(t.id==='syssv'){const to=+$('#st2').value,pw=+$('#sw').value,er=$('#sye');if(!(to>=5&&to<=240))er.textContent='Session timeout must be 5–240 minutes.';else if(!(pw>=6&&pw<=32))er.textContent='Password length must be 6–32.';else{Object.assign(SYS,{tz:$('#sz').value,cur:$('#sc2').value,timeout:to,pw,maint:$('#sm2').checked});toast('System settings saved')}}});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;if(S.role!=='owner')return;
 if(d.sp){const b=BIZ.find(x=>x.id==d.sp);b.plan=t.value;note(b.id,'Plan changed to '+t.value);toast('Plan updated');render()}
 else if(d.ss){const b=BIZ.find(x=>x.id==d.ss);b.sub=t.value;note(b.id,'Subscription status: '+t.value);toast('Subscription updated');render()}
 else if(d.tk){TICKETS.find(x=>x.id===d.tk).st=t.value;render()}
 else if(t.id==='pyf'){S.pyf=t.value;render()}else if(t.id==='tkf'){S.tkf=t.value;render()}});
render();

</script></body></html>
