services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: dms, POSTGRES_PASSWORD: dms, POSTGRES_DB: dms }
    volumes: [dbdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U dms"], interval: 5s, retries: 10 }
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://dms:dms@db:5432/dms
      NODE_ENV: development
    depends_on: { db: { condition: service_healthy } }
    ports: ["4000:4000"]
    volumes: [files:/app/storage]
volumes: { dbdata: {}, files: {} }
